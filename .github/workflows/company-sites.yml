name: Company sites check
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: job-finder
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python run.py --cloud
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # Application worker: tailored resume, email, Telegram approval. Code and log live in the private repo.
      - name: Get application worker
        if: always() && hashFiles('inbox/*.json') != ''
        uses: actions/checkout@v4
        with:
          repository: MUNIGOUTHAM-REDDY/job-applications
          token: ${{ secrets.DISPATCH_TOKEN }}
          path: apps
      - name: Prepare applications
        if: always() && hashFiles('inbox/*.json') != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          pip install -q anthropic fpdf2
          python apps/worker.py inbox inbox cloud
          cd apps
          git config user.name "job-applications-bot"
          git config user.email "job-applications-bot@users.noreply.github.com"
          git add applications resumes jobs 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Update applications"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && exit 0; sleep $((RANDOM % 8 + 2)); done
          exit 1
      - name: Save seen jobs
        run: |
          git config user.name "job-finder-bot"
          git config user.email "job-finder-bot@users.noreply.github.com"
          git add state/seen-cloud.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen jobs"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
