<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Application Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f8fa; --panel: #ffffff; --ink: #1f2430; --muted: #6b7280; --faint: #9aa1ad; --line: #e6e8ec;
  --hover: #f1f3f6; --accent: #7b68ee; --accent-soft: #efedfd; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }

/* top bar */
.top { background: var(--panel); border-bottom: 1px solid var(--line); padding: 14px 20px 0; position: sticky; top: 0; z-index: 5; }
.title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #7b68ee, #49ccf9); display: grid; place-items: center; color: #fff; font-weight: 700; }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
.updated { color: var(--faint); font-size: 12px; margin-left: auto; }
.tabs { display: flex; gap: 18px; margin-top: 12px; }
.tab { text-decoration: none; cursor: pointer; padding: 8px 0; border-bottom: 2px solid transparent; color: var(--muted); font-weight: 500; }
.tab.on { color: var(--ink); border-color: var(--accent); }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 12px 20px; flex-wrap: wrap; }
.search { flex: 1 1 220px; max-width: 320px; position: relative; }
.search input { width: 100%; padding: 7px 10px 7px 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { background: var(--accent-soft); border-color: #d6d0fb; color: #5b4bd5; }
.kpis { display: flex; gap: 18px; color: var(--muted); font-size: 12px; margin-left: auto; flex-wrap: wrap; }
.kpis b { color: var(--ink); font-size: 14px; margin-right: 4px; }

/* board */
.board { display: flex; gap: 12px; padding: 4px 20px 24px; overflow-x: auto; align-items: flex-start; min-height: calc(100vh - 150px); }
.col { flex: 0 0 272px; background: #f0f1f4; border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 170px); }
.col.drop { outline: 2px dashed var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: #fff; }
.count { color: var(--muted); font-weight: 500; }
.cards { padding: 0 8px 10px; overflow-y: auto; display: grid; gap: 8px; }
.empty-col { color: var(--faint); text-align: center; padding: 18px 8px; border: 1px dashed #d9dce2; border-radius: 8px; font-size: 12px; }
.card { background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); padding: 10px 11px; cursor: pointer; border: 1px solid transparent; }
.card:hover { border-color: #d6d0fb; }
.card.dragging { opacity: .45; }
.card .t { font-weight: 600; line-height: 1.35; }
.card .c { color: var(--muted); margin-top: 2px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 5px; background: var(--hover); color: var(--muted); }
.tag.fit-hi { background: #e7f6ec; color: #18794e; } .tag.fit-mid { background: #fff4e0; color: #a35c00; } .tag.fit-lo { background: #fdecec; color: #b42318; }
.tag.mail { background: #e8f1fe; color: #1d5bd8; }
.card .foot { display: flex; justify-content: space-between; color: var(--faint); font-size: 11px; margin-top: 8px; }

/* insights */
.ins { padding: 4px 20px 32px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); align-items: start; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 4px; font-size: 14px; }
.panel .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) 46px 74px; gap: 8px; align-items: center; }
.bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { grid-column: 1 / -1; height: 5px; background: var(--hover); border-radius: 3px; margin-top: -3px; }
.bar .fill { height: 100%; border-radius: 3px; background: var(--accent); }
.bar .pct { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.have { font-size: 11px; text-align: center; border-radius: 5px; padding: 1px 0; }
.have.yes { background: #e7f6ec; color: #18794e; } .have.no { background: #fdecec; color: #b42318; } .have.na { color: var(--faint); }
.big { display: flex; gap: 22px; flex-wrap: wrap; }
.big div b { display: block; font-size: 22px; }
.big div span { color: var(--muted); font-size: 12px; }
.gaps { display: flex; flex-wrap: wrap; gap: 6px; }
.gaps span { background: #fdecec; color: #b42318; border-radius: 6px; padding: 4px 9px; font-size: 12px; }
.wide { grid-column: 1 / -1; }

/* track toggle */
.seg { display: inline-flex; background: var(--hover); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.tag.where { background: #eef6ff; color: #1d5bd8; } .tag.pt { background: #fff4e0; color: #a35c00; }

/* all jobs */
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 20px 10px; }
.chip-f { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip-f b { color: var(--ink); margin-left: 4px; }
.chip-f.on { background: var(--accent-soft); border-color: #d6d0fb; color: #5b4bd5; }
.jt { margin: 0 20px 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.jr { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.1fr) 90px 80px minmax(0, 1.8fr); gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); align-items: center; cursor: pointer; }
.jr:hover { background: var(--hover); }
.jr.head { border-top: 0; background: var(--bg); color: var(--faint); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; cursor: default; }
.jr .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jr .c, .jr .m { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.why { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #fdecec; color: #b42318; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.why.ok { background: #e7f6ec; color: #18794e; }
.more { display: block; margin: 0 auto 28px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
.facts div span { display: block; color: var(--faint); font-size: 11px; }
.desc { white-space: pre-wrap; max-height: 360px; overflow-y: auto; }
@media (max-width: 760px) { .jr { grid-template-columns: minmax(0, 1fr) auto; } .jr .hide-sm { display: none; } .jt { margin: 0 16px 24px; } .chips { padding: 0 16px 10px; } }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(15,20,30,.25); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 10; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; height: 100%; width: min(480px, 100%); background: var(--panel); box-shadow: -8px 0 24px rgba(16,24,40,.12);
          transform: translateX(100%); transition: transform .18s ease; z-index: 11; display: flex; flex-direction: column; }
.drawer.on { transform: none; }
.d-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.d-head h2 { font-size: 17px; margin: 6px 0 2px; }
.d-body { padding: 16px 20px 28px; overflow-y: auto; display: grid; gap: 16px; }
.d-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); margin-bottom: 6px; }
select.status { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
.box { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.mail-body { white-space: pre-wrap; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.events li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; color: var(--muted); }
.events li span:first-child { color: var(--faint); font-size: 12px; }
textarea { width: 100%; min-height: 90px; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; resize: vertical; }
.x { margin-left: auto; border: 0; background: none; cursor: pointer; font-size: 20px; color: var(--muted); line-height: 1; }
a { color: #5b4bd5; }

/* connect */
.connect { max-width: 520px; margin: 60px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; box-shadow: var(--shadow); }
.connect h2 { margin: 0 0 6px; font-size: 18px; }
.connect p { color: var(--muted); }
.connect input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0 12px; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2430; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; z-index: 20; }
.toast.on { opacity: 1; }
@media (max-width: 640px) { .top, .toolbar { padding-left: 16px; padding-right: 16px; } .board { padding: 4px 16px 24px; } .kpis { margin-left: 0; } }

/* map */
.mapwrap { display: grid; grid-template-columns: 340px 1fr; gap: 12px; padding: 0 20px 20px; height: calc(100vh - 170px); min-height: 420px; }
#map { border-radius: 10px; border: 1px solid var(--line); z-index: 1; }
.mlist { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; }
.mi { padding: 9px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.mi:hover, .mi.on { background: var(--accent-soft); }
.mi b { display: block; font-weight: 600; }
.mi span { color: var(--muted); font-size: 12px; }
.mi .km { float: right; color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .mapwrap { grid-template-columns: 1fr; height: auto; } #map { height: 55vh; } .mlist { max-height: 40vh; } }
</style>
</head>
<body>
<header class="top">
  <div class="title-row">
    <div class="logo">J</div>
    <h1>Job Applications</h1>
    <span class="updated" id="updated"></span>
    <div class="seg" role="group" aria-label="Which job search">
      <button id="t-design" data-track="design">Design jobs</button><button id="t-quick" data-track="quick">Quick jobs</button>
    </div>
  </div>
  <nav class="tabs"><a class="tab on" href="#board" data-view="board">Board</a><a class="tab" href="#jobs" data-view="jobs">All jobs</a><a class="tab" href="#insights" data-view="insights">Insights</a><a class="tab" id="tab-map" href="#map" data-view="map" hidden>Map</a></nav>
</header>

<section class="connect" id="connect" hidden>
  <h2>Connect your application log</h2>
  <p>Open your private dashboard link once, or paste the key from it here (<code>DASH_KEY</code> in your <code>.env</code> file).
     It's kept only in this browser and sent only to your Supabase project.</p>
  <input id="token" type="password" placeholder="Dashboard key" autocomplete="off">
  <button class="btn primary" id="save">Connect</button>
  <p id="err" style="color:#b42318"></p>
</section>

<div id="app" hidden>
  <div class="toolbar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Search company or role">
    </label>
    <button class="btn" id="f-mail">✉️ Emailed</button>
    <button class="btn" id="f-fit">Fit 70+</button>
    <button class="btn" id="f-skip">Show skipped</button>
    <select class="btn" id="bsort" aria-label="Sort cards"><option value="recent">Recent first</option><option value="near">Nearest first</option></select>
    <button class="btn" id="reload">↻ Refresh</button>
    <div class="kpis" id="kpis"></div>
  </div>
  <main class="board" id="board"></main>
</div>

<div id="view-jobs" hidden>
  <div class="toolbar">
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="jq" placeholder="Search role, company or skill">
    </label>
    <select class="btn" id="jsource"><option value="">All sources</option></select>
    <select class="btn" id="jsort" aria-label="Sort jobs"><option value="recent">Recent first</option><option value="near">Nearest first</option></select>
    <select class="btn" id="jperiod"><option value="1">Last 24 hours</option><option value="7" selected>Last 7 days</option><option value="30">Last 30 days</option><option value="0">All time</option></select>
    <span class="updated" id="jnote" style="margin-left:0"></span>
  </div>
  <div class="chips" id="jchips"></div>
  <div class="jt" id="jtable"></div>
  <button class="btn more" id="jmore" hidden>Show more</button>
</div>

<div id="view-insights" hidden>
  <div class="toolbar">
    <select class="btn" id="period"><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="0">All time</option></select>
    <select class="btn" id="scope"><option value="all">All design jobs seen</option><option value="alerted">Only jobs that passed my filters</option></select>
    <span class="updated" id="ins-note" style="margin-left:0"></span>
  </div>
  <div class="ins" id="ins"></div>
</div>

<div id="view-map" hidden>
  <div class="toolbar">
    <label class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="mq" placeholder="Search BPO or company"></label>
    <select class="btn" id="mrad"><option value="2">Within 2 km</option><option value="4">Within 4 km</option><option value="6" selected>Within 6 km</option><option value="7">Within 7 km</option></select>
    <button class="btn" id="mloc">📍 Use my location</button>
    <span class="updated" id="mnote" style="margin-left:0"></span>
  </div>
  <div class="mapwrap"><div class="mlist" id="mlist"></div><div id="map"></div></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Job details"></aside>
<div class="toast" id="toast"></div>

<script>
// The publishable key is safe to publish: the tables only open with the private dashboard key (supabase/schema.sql).
const SUPABASE = { url: "https://gxikjrnijfmmtbnokvqu.supabase.co", key: "sb_publishable_4XSr1n8mc6Qdae3eVgykaw_ye639e_g" };
const COLS = [
  { id: "prepared",  name: "Waiting for you", color: "#87909e" },
  { id: "approved",  name: "Approved",        color: "#4466ff" },
  { id: "applied",   name: "Applied",         color: "#7b68ee" },
  { id: "interview", name: "Interview",       color: "#f9a03f" },
  { id: "offer",     name: "Offer",           color: "#2ea44f" },
  { id: "rejected",  name: "Rejected",        color: "#e5484d" },
  { id: "skipped",   name: "Skipped",         color: "#4b5563" },
  { id: "error",     name: "Error",           color: "#b42318" },
];
const NAME = Object.fromEntries(COLS.map(c => [c.id, c.name]));
let token = null, allApps = [], apps = [], openKey = null, TRACK = "design";
try { TRACK = localStorage.getItem("track") || "design"; } catch (e) {}
const trackOf = x => x.track || "design";
const F = { mail: false, fit: false, skip: false };
try { token = localStorage.getItem("dash_key"); } catch (e) {}
// A private link ending in #key=... saves the key, then removes it from the address bar.
function takeLinkKey() {
  const m = location.hash.match(/^#key=([\w-]+)$/);
  if (!m) return false;
  token = m[1]; try { localStorage.setItem("dash_key", token); localStorage.removeItem("gh_token"); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
  return true;
}
takeLinkKey();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = s => s ? new Date(s).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";
const ago = s => { if (!s) return ""; const m = (Date.now() - new Date(s)) / 6e4;
  return m < 60 ? `${Math.max(1, m | 0)}m ago` : m < 1440 ? `${(m / 60) | 0}h ago` : `${(m / 1440) | 0}d ago`; };
const toast = t => { const el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(() => el.classList.remove("on"), 1800); };

async function sb(path, opts = {}) {
  const r = await fetch(SUPABASE.url + "/rest/v1/" + path, { ...opts,
    headers: { apikey: SUPABASE.key, "x-dash-key": token, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 140));
  return r.status === 204 ? null : r.json();
}
async function sbAll(path) {  // Supabase returns at most 1000 rows a request: read pages, four at a time
  const rows = [];
  for (let at = 0; ; at += 4000) {
    const pages = await Promise.all([0, 1000, 2000, 3000].map(n => sb(`${path}&limit=1000&offset=${at + n}`)));
    pages.forEach(p => rows.push(...p));
    if (pages.some(p => p.length < 1000)) return rows;
  }
}
// What the search recorded (data) with your dashboard edits (board) on top.
function toApp({ key, data, board }) {
  const events = [...(data.events || []), ...(board.events || [])].sort((a, b) => new Date(a.at) - new Date(b.at));
  return { ...data, ...board, key, events, _data: data, _board: board };
}

async function load() {
  $("updated").textContent = "Loading…";
  const rows = await sbAll("applications?select=key,data,board&order=key");
  // A wrong key doesn't raise an error, it just sees no rows.
  if (!rows.length) throw new Error("401 no data for this key");
  allApps = rows.map(toApp);
  apps = allApps.filter(a => trackOf(a) === TRACK);
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
  render();
  if (openKey) openDrawer(openKey);
}

// ---- distance from home (areas table lives in config.json, shared with the quick-jobs search) ----
let HOME = { name: "HSR Layout Sector 7", lat: 12.9106, lon: 77.6395 }, AREAS = [];
fetch("https://raw.githubusercontent.com/MUNIGOUTHAM-REDDY/Job-Finder/main/config.json", { cache: "no-cache" })
  .then(r => r.json()).then(c => { HOME = c.quick.home || HOME;
    AREAS = Object.entries(c.quick.areas || {}).sort((a, b) => b[0].length - a[0].length)
      .map(([n, ll]) => [n, ll, new RegExp("(?<![a-z])" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![a-z])", "i")]);
    render(); renderJobs(); if (openKey) openDrawer(openKey); }).catch(() => {});
const kmBetween = (a, b, c, d) => { const p = Math.PI / 180, h = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const titleArea = n => n.replace(/\b(hsr|btm|jp|mg|kr|rt|cv)\b/gi, m => m.toUpperCase()).replace(/\b[a-z]/g, m => m.toUpperCase());
function nearestArea(text) {
  let best = null;
  for (const [n, ll, rx] of AREAS) if (rx.test(text)) { const d = kmBetween(HOME.lat, HOME.lon, ll[0], ll[1]); if (!best || d < best.km) best = { area: titleArea(n), km: d }; }
  return best;
}
const REMOTE_RX = /\bremote\b|work from home|\bwfh\b/i;
function place(r) {  // {kind: "remote" | "km" | "unknown", km, area, rank}
  if (r.where === "remote" || REMOTE_RX.test(r.location || "")) return { kind: "remote", rank: -1 };
  if (r.distance_km != null) return { kind: "km", km: r.distance_km, area: titleArea(r.area || ""), rank: r.distance_km };
  const hit = nearestArea(r.location || "") || (/bengaluru|bangalore/i.test(r.location || "") ? nearestArea((r.description || "").slice(0, 3000)) : null);
  return hit ? { kind: "km", km: hit.km, area: hit.area, rank: hit.km } : { kind: "unknown", rank: 1e6 };
}
function placeLabel(r) {
  const p = place(r);

}
const byNearest = (a, b) => place(a).rank - place(b).rank || (b.found_at || b.seen_at || "").localeCompare(a.found_at || a.seen_at || "");

const WHY = {
  alerted: "Sent to you", location: "Outside Hyderabad, Bangalore or remote", experience: "Asks for too much experience",
  "too many applicants": "Too many applicants", "too old": "Posted too long ago", salary: "Pays below 6 LPA",
  "design-eng without UI signals": "Engineering role, not UI design", "agency or job drive": "Agency or job drive",
  "possible scam": "Possible scam", "not a quick-start role": "Not a quick-start role", "not for freshers": "Not for freshers", "farther than 6 km from HSR": "Farther than 6 km from HSR",
};
const whyShort = r => WHY[r.outcome] || r.outcome;
function whyLong(r) {
  const o = r.outcome;
  if (o === "alerted") return trackOf(r) === "quick" ? "Passed every filter: it's on the Board and in your hourly Telegram digest." : "Passed every filter, so it was sent to you in Telegram.";
  const quick = trackOf(r) === "quick";
  if (o === "location") return quick ? `Location "${r.location || "unknown"}" is outside Bengaluru and not remote.`

  if (o === "farther than 6 km from HSR") return `Location "${r.location}" is farther than about 6 km from HSR Layout Sector 7, and it isn't remote.`;
  if (o === "not a quick-start role") return "The title isn't one of the entry-level role types this search looks for (support, BPO, back office, data, sales, admin, trainee, design gigs…).";
  if (o === "not for freshers") return `Not a fresher role: ${r.exp_min ? "asks for at least " + r.exp_min + " year(s) of experience" : r.exp_text && /level/i.test(r.exp_text) ? "LinkedIn lists it as " + r.exp_text : "the post asks for prior experience or rules out freshers"}.`;
  if (o === "agency or job drive") return "Posted by a recruitment agency or consultancy, or it's a walk-in / mass hiring drive.";
  if (o === "possible scam") return "The post shows scam signs: fees or deposits, pay-per-day promises, typing/copy-paste work, Telegram/WhatsApp-only contact, or part-time pay that's too good to be true.";
  if (o === "experience") return `Asks for at least ${r.exp_min} years (${r.exp_text || "from the description"}). Your limit is a minimum of ${quick ? "1 year" : "5 years"} or less.`;
  if (o === "salary" && quick) return `Full-time pay tops out at about ₹${Math.round(r.salary_max_lpa * 1e5 / 12 / 1000)}k a month (${r.salary_text || "from the post"}). Your minimum is ₹22k.`;
  if (o === "too many applicants") return `Already had ${r.applicants} applicants when found. Your limit is under 100.`;
  if (o === "too old") return `Posted ${r.posted_at ? when(r.posted_at) : "too long before it was found"}. Only jobs from the last ${quick ? "48" : "24"} hours are sent.`;
  if (o === "salary") return `Top of the stated salary is ₹${r.salary_max_lpa} LPA (${r.salary_text || "from the post"}). Your minimum is 6 LPA.`;
  if (o === "design-eng without UI signals") return "Titled \"design engineer\", but the description doesn't mention UI tools or screens (Figma, prototypes, CSS…). In India this usually means mechanical or chip design.";

}

function renderInsights() {
  if (!archive) return;
  const days = +$("period").value, cutoff = days ? Date.now() - days * 864e5 : 0;
  const all = archive.filter(r => (!cutoff || new Date(r.seen_at || r.posted_at || 0) >= cutoff) && ($("scope").value === "all" || r.outcome === "alerted"));
  const withText = all.filter(r => (r.description || "").length > 200);
  $("ins-note").textContent = `${all.length} jobs · ${withText.length} with a full description (skills are counted from these)`;
  if (!withText.length) { $("ins").innerHTML = `<div class="panel wide">No job descriptions saved for this period yet. They build up as the checks run.</div>`; return; }

  const count = cat => { const c = {}; withText.forEach(r => (r.skills?.[cat] || []).forEach(s => c[s] = (c[s] || 0) + 1));
    return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const pct = n => Math.round(100 * n / withText.length);
  const gaps = [];
  const panel = (cat, limit) => {
    const rows = count(cat).slice(0, limit);
    rows.forEach(([n, c]) => { if (inResume(n) === false && pct(c) >= 10) gaps.push([n, pct(c)]); });
    return `<section class="panel"><h3>${CAT[cat]}</h3><p class="hint">Share of postings that mention it</p><div class="bars">${rows.map(([n, c]) => {
      const have = inResume(n);
      return `<div class="bar"><span class="name" title="${esc(n)}">${esc(n)}</span><span class="pct">${pct(c)}%</span>
        <span class="have ${have === null ? "na" : have ? "yes" : "no"}">${have === null ? "–" : have ? "In resume" : "Missing"}</span>
        <div class="track"><div class="fill" style="width:${pct(c)}%"></div></div></div>`; }).join("") || `<span class="hint">None found</span>`}</div></section>`;
  };
  const panels = ["design", "tools", "development", "ai", "domain"].map(c => panel(c, c === "design" ? 16 : 10)).join("");

  const exps = all.filter(r => r.exp_min != null).map(r => r.exp_min).sort((a, b) => a - b);
  const median = exps.length ? exps[exps.length >> 1] : null;
  const sal = all.filter(r => r.salary_max_lpa).map(r => r.salary_max_lpa).sort((a, b) => a - b);
  const top = (key, n) => { const c = {}; all.forEach(r => { const k = (r[key] || "").trim(); if (k) c[k] = (c[k] || 0) + 1; });
    return Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, n); };
  const list = (rows) => `<div class="bars">${rows.map(([n, c]) => `<div class="bar"><span class="name">${esc(n)}</span><span class="pct">${c}</span><span></span></div>`).join("")}</div>`;
  const outcomes = top("outcome", 8);
  gaps.sort((a, b) => b[1] - a[1]);

  $("ins").innerHTML = `
    <section class="panel wide"><div class="big">
      <div><b>${all.length}</b><span>${TRACK === "quick" ? "quick jobs" : "design jobs"} seen</span></div>
      <div><b>${all.filter(r => r.outcome === "alerted").length}</b><span>passed your filters</span></div>
      ${TRACK === "quick" ? `<div><b>${all.filter(r => r.outcome === "agency or job drive").length}</b><span>agency posts dropped</span></div><div><b>${all.filter(r => r.outcome === "possible scam").length}</b><span>likely scams dropped</span></div>` : ""}
      <div><b>${median ?? "–"}${median != null ? " yrs" : ""}</b><span>typical minimum experience</span></div>
      <div><b>${sal.length ? "₹" + sal[sal.length >> 1] + " LPA" : "–"}</b><span>typical top salary (${sal.length} posted)</span></div>
      <div><b>${all.length ? Math.round(100 * all.filter(r => r.has_email).length / all.length) : 0}%</b><span>posts with an email</span></div>
    </div></section>
    ${TRACK === "quick" ? "" : `<section class="panel wide"><h3>Worth learning next</h3><p class="hint">Asked for in 10% or more of postings and not in your resume yet. If you already have one, add it to LinkedIn so the next resume sync picks it up.</p>
      <div class="gaps">${gaps.map(([n, p]) => `<span>${esc(n)} · ${p}%</span>`).join("") || `<span style="background:#e7f6ec;color:#18794e">No big gaps right now</span>`}</div></section>`}
    ${panels}
    <section class="panel"><h3>Most common titles</h3><p class="hint">Number of postings</p>${list(top("title", 10))}</section>
    <section class="panel"><h3>Companies hiring most</h3><p class="hint">Number of postings</p>${list(top("company", 10))}</section>
    <section class="panel"><h3>Why jobs were filtered out</h3><p class="hint">"alerted" means it reached you</p>${list(outcomes)}</section>`;
}

/* ---- Map: BPO / call-centre offices near you (docs/bpo.json, built by bpo_map.py from OpenStreetMap) ---- */
let MAP = null, MAPDATA = null, MY = null, markers = [], mapLayers = [];
const dist = (a, b, c, d) => { const p = Math.PI / 180, h = Math.sin((c - a) * p / 2) ** 2 + Math.cos(a * p) * Math.cos(c * p) * Math.sin((d - b) * p / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
async function loadScript(src) { await new Promise((ok, no) => { const e = document.createElement("script"); e.src = src; e.onload = ok; e.onerror = no; document.head.appendChild(e); }); }
async function liveBpos() {
  // Fallback when bpo.json hasn't been built: ask OpenStreetMap directly (public servers are sometimes busy).
  const [la, lo] = [12.9116, 77.6474];
  const q = `[out:json][timeout:25];(nwr["office"="call_centre"](around:7000,${la},${lo});nwr["name"~"BPO|call ?cent|KPO|contact cent|customer (care|support|service)|teleperformance|concentrix|conduent|genpact|startek|firstsource|sutherland|alorica|foundever|ibex|taskus|ttec|infosys bpm|xl dynamics",i](around:7000,${la},${lo}););out center tags 300;`;
  for (const host of ["overpass-api.de", "overpass.kumi.systems", "overpass.private.coffee"]) {
    try {
      const r = await fetch(`https://${host}/api/interpreter`, { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
      if (!r.ok) continue;
      const items = (await r.json()).elements.filter(e => e.tags?.name && (e.center || e.lat)).map(e => { const c = e.center || e, t = e.tags;
        return { name: t.name, lat: c.lat, lon: c.lon, addr: ["addr:housename", "addr:street", "addr:suburb", "addr:city"].map(k => t[k]).filter(Boolean).join(", ") }; });
      return { center: [la, lo], items };
    } catch (e) {}
  }
  throw new Error("the OpenStreetMap servers are busy, try again in a few minutes");
}
async function initMap() {
  if (MAP) return renderMap();
  $("mnote").textContent = "Loading map…";
  try {
    if (!window.L) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js");
    MAPDATA = await fetch("bpo.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject()).catch(liveBpos);
  } catch (e) { $("mnote").textContent = "Couldn't load the map: " + e.message; return; }
  MY = { lat: MAPDATA.center[0], lon: MAPDATA.center[1], label: "HSR Layout, Sector 7" };
  MAP = L.map("map").setView([MY.lat, MY.lon], 13);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }).addTo(MAP);
  renderMap();
}
function renderMap() {
  mapLayers.forEach(l => l.remove()); mapLayers = []; markers = [];
  const max = +$("mrad").value, q = $("mq").value.toLowerCase();
  const items = MAPDATA.items.map(o => ({ ...o, d: dist(MY.lat, MY.lon, o.lat, o.lon) }))
    .filter(o => o.d <= max && (!q || (o.name + " " + o.addr).toLowerCase().includes(q))).sort((a, b) => a.d - b.d);
  mapLayers.push(L.circle([MY.lat, MY.lon], { radius: max * 1000, color: "#7b68ee", weight: 1, fillOpacity: .05 }).addTo(MAP),
    L.marker([MY.lat, MY.lon], { icon: L.divIcon({ className: "", html: '<div style="font-size:26px;line-height:26px">🏠</div>', iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(MAP).bindPopup("<b>You</b><br>" + esc(MY.label)));
  $("mlist").innerHTML = items.length ? items.map((o, i) => `<div class="mi" data-i="${i}"><span class="km">${o.d.toFixed(1)} km</span><b>${esc(o.name)}</b><span>${esc(o.addr) || "Address not listed"}</span></div>`).join("")
    : '<div class="mi"><span>No BPOs found in this range.</span></div>';
  items.forEach((o, i) => {
    const m = L.marker([o.lat, o.lon]).addTo(MAP).bindPopup(`<b>${esc(o.name)}</b><br>${esc(o.addr)}<br>${o.d.toFixed(1)} km away<br>` +
      `<a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lon}">Directions</a> · ` +
      `<a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(o.name + " careers Bengaluru")}">Careers</a>`);
    markers.push(m); mapLayers.push(m);
  });
  document.querySelectorAll(".mi[data-i]").forEach(el => el.onclick = () => { const m = markers[+el.dataset.i]; MAP.setView(m.getLatLng(), 16); m.openPopup();
    document.querySelectorAll(".mi").forEach(x => x.classList.toggle("on", x === el)); });
  $("mnote").textContent = `${items.length} BPO${items.length === 1 ? "" : "s"} within ${max} km of ${MY.label}`;
  MAP.fitBounds(L.circle([MY.lat, MY.lon], { radius: max * 1000 }).getBounds());
  setTimeout(() => MAP.invalidateSize(), 50);
}
$("mrad").onchange = () => MAP && renderMap(); $("mq").oninput = () => MAP && renderMap();
$("mloc").onclick = () => {
  if (!navigator.geolocation) return $("mnote").textContent = "Your browser can't share location.";
  $("mnote").textContent = "Finding you…";
  navigator.geolocation.getCurrentPosition(p => { MY = { lat: p.coords.latitude, lon: p.coords.longitude, label: "your location" }; renderMap(); },
    () => $("mnote").textContent = "Location was blocked; showing HSR Layout Sector 7.", { timeout: 10000 });
};

function setTrack(t) {
  TRACK = t; try { localStorage.setItem("track", t); } catch (e) {}
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.track === t));
  $("f-mail").hidden = $("f-fit").hidden = t === "quick"; $("tab-map").hidden = t !== "quick"; if (t !== "quick" && location.hash === "#map") location.hash = "#board"; else setView();
  COLS[0].name = NAME.prepared = t === "quick" ? "New" : "Waiting for you";
  apps = allApps.filter(a => trackOf(a) === TRACK);
  if (fullArchive) archive = fullArchive.filter(r => trackOf(r) === TRACK);
  JF.outcome = ""; closeDrawer(); render(); renderJobs(); renderInsights();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => setTrack(b.dataset.track));

function visible(a) {
  const q = $("q").value.toLowerCase();
  return (!q || (a.company + " " + a.title).toLowerCase().includes(q)) && (!F.mail || a.email) && (!F.fit || (a.fit?.score || 0) >= 70);
}

function render() {
  const n = s => apps.filter(a => a.status === s).length;
  $("kpis").innerHTML = `<span><b>${apps.length}</b>found</span><span><b>${apps.filter(a => a.email).length}</b>emailed</span>
    <span><b>${n("applied") + n("interview") + n("offer") + n("rejected")}</b>applied</span><span><b>${n("interview")}</b>interviews</span><span><b>${n("offer")}</b>offers</span>`;
  const cols = COLS.filter(c => (c.id !== "skipped" || F.skip) && (c.id !== "error" || n("error")));
  $("board").innerHTML = cols.map(c => {
    const items = apps.filter(a => a.status === c.id && visible(a))
      .sort($("bsort").value === "near" ? byNearest : (a, b) => (b.found_at || "").localeCompare(a.found_at || ""));
    return `<section class="col" data-status="${c.id}">
      <div class="col-head"><span class="pill" style="background:${c.color}">${c.name}</span><span class="count">${items.length}</span></div>
      <div class="cards">${items.length ? items.map(card).join("") : `<div class="empty-col">Drop cards here</div>`}</div>
    </section>`;
  }).join("");

  document.querySelectorAll(".card").forEach(el => {
    el.onclick = () => openDrawer(el.dataset.key);
    el.ondragstart = e => { e.dataTransfer.setData("text/plain", el.dataset.key); el.classList.add("dragging"); };
    el.ondragend = () => el.classList.remove("dragging");
  });
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add("drop"); };
    col.ondragleave = () => col.classList.remove("drop");
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove("drop");
      const a = apps.find(x => x.key === e.dataTransfer.getData("text/plain"));
      if (a && a.status !== col.dataset.status) setStatus(a, col.dataset.status);
    };
  });
}

function card(a) {
  const fit = a.fit?.score, cls = fit >= 75 ? "fit-hi" : fit >= 50 ? "fit-mid" : "fit-lo";
  return `<article class="card" draggable="true" data-key="${a.key}">
    <div class="t">${esc(a.title)}</div>
    <div class="c">${esc(a.company)}${a.location ? " · " + esc(a.location.split(",")[0]) : ""}</div>
    <div class="tags">
      ${fit != null ? `<span class="tag ${cls}">Fit ${fit}</span>` : ""}
      ${a.email ? `<span class="tag mail">Emailed</span>` : ""}
      ${placeLabel(a) ? `<span class="tag where">${esc(placeLabel(a))}</span>` : ""}
      ${a.track === "quick" ? `<span class="tag pt">${a.part_time ? "Part-time" : "Full-time"}</span>` : ""}
      ${a.agency ? `<span class="tag" title="Posted by a placement agency; the post lists specific openings">Agency</span>` : ""}
      ${a.track === "quick" && a.salary_max_lpa ? `<span class="tag">₹${Math.round(a.salary_max_lpa * 1e5 / 12 / 1000)}k/mo</span>` : ""}
      <span class="tag">${esc(a.source)}</span>
    </div>
    <div class="foot"><span>${ago(a.found_at)}</span><span>${(a.events || []).length} updates</span></div>
  </article>`;
}

function openDrawer(key) {
  const a = apps.find(x => x.key === key); if (!a) return;
  openKey = key;
  const col = COLS.find(c => c.id === a.status) || COLS[0];
  $("drawer").innerHTML = `
    <div class="d-head">
      <div class="d-row"><span class="pill" style="background:${col.color}">${col.name}</span><button class="x" id="close" aria-label="Close">×</button></div>
      <h2>${esc(a.title)}</h2>
      <div style="color:var(--muted)">${esc(a.company)} · ${esc(a.location || "")} · ${esc(a.source)}</div>
    </div>
    <div class="d-body">
      <div class="d-row">
        <select class="status" id="d-status">${COLS.map(c => `<option value="${c.id}" ${c.id === a.status ? "selected" : ""}>${c.name}</option>`).join("")}</select>
        <a class="btn" href="${esc(a.url)}" target="_blank" rel="noopener">Open job ↗</a>
        ${a.resume ? `<button class="btn" id="d-pdf">Resume PDF</button>` : ""}
      </div>
      ${a.fit ? `<div><div class="label">Fit ${a.fit.score}/100</div><div>${esc(a.fit.reason)}</div>
        ${a.fit.gaps?.length ? `<div style="color:var(--muted);margin-top:6px">Gaps: ${esc(a.fit.gaps.join("; "))}</div>` : ""}</div>` : ""}
      <div><div class="label">Email</div>${a.email
        ? `<div class="box"><div style="font-weight:600">${esc(a.email.subject)}</div><div style="color:var(--muted);font-size:12px;margin-bottom:8px">To ${esc(a.email.to)} · ${when(a.email.sent_at)}</div><div class="mail-body">${esc(a.email.body)}</div></div>`
        : `<div style="color:var(--muted)">Not sent: ${esc(a.email_skipped || "no email found")}</div>`}</div>
      ${(() => { const r = a.description ? a : (archive || []).find(x => x.key === a.key);
        return r ? detailsHTML({ ...r, ...a, description: a.description || r.description, skills: a.skills || r.skills })
                 : `<div><div class="label">About the job</div><div style="color:var(--muted)">${archive ? "No saved details for this job." : "Loading job details…"}</div></div>`; })()}
      <div><div class="label">Notes</div><textarea id="d-notes" placeholder="Who you spoke to, interview dates, follow-ups…">${esc(a.notes || "")}</textarea>
        <button class="btn" id="d-save" style="margin-top:8px">Save notes</button></div>
      <div><div class="label">History</div><ul class="events">${(a.events || []).slice().reverse().map(e => `<li><span>${when(e.at)}</span><span>${esc(e.text)}</span></li>`).join("")}</ul></div>
    </div>`;
  $("drawer").classList.add("on"); $("scrim").classList.add("on");
  if (!archive && !a.description) loadArchive().catch(() => {});
  $("close").onclick = closeDrawer;
  $("d-status").onchange = e => setStatus(a, e.target.value);
  $("d-save").onclick = () => update(a, { notes: $("d-notes").value }, null).then(ok => ok && toast("Notes saved"));
  const pdf = $("d-pdf"); if (pdf) pdf.onclick = () => openPdf(a);
}
function closeDrawer() { openKey = null; $("drawer").classList.remove("on"); $("scrim").classList.remove("on"); }
$("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e => e.key === "Escape" && closeDrawer());

async function setStatus(a, status) {
  const prev = a.status; a.status = status; render(); if (openKey) openDrawer(openKey);
  const ok = await update(a, { status }, `Moved to ${NAME[status]} on the board`);
  if (!ok) { a.status = prev; render(); } else toast(`Moved to ${NAME[status]}`);
}

async function update(a, changes, eventText) {
  const board = { ...a._board, ...changes };
  if (eventText) board.events = [...(a._board.events || []), { at: new Date().toISOString().slice(0, 19) + "+00:00", text: eventText }];
  try {
    const rows = await sb(`applications?key=eq.${encodeURIComponent(a.key)}&select=key,data,board`,
      { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify({ board }) });
    if (!rows.length) throw new Error("not saved");
    Object.assign(a, toApp(rows[0]));
    if (openKey === a.key) openDrawer(a.key);
    return true;
  } catch (e) { toast("Couldn't save. Refresh and try again."); return false; }
}

async function openPdf(a) {
  const w = window.open("", "_blank");
  try {
    const [row] = await sb(`resumes?select=pdf_base64&name=eq.${encodeURIComponent(a.resume.split("/").pop())}`);
    const bytes = Uint8Array.from(atob(row.pdf_base64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
    if (w) w.location = url; else location.href = url;
  } catch (e) { w?.close(); toast("Couldn't open the resume. Try again."); }
}

function toggle(id, key) { $(id).onclick = () => { F[key] = !F[key]; $(id).classList.toggle("on", F[key]); render(); }; }
for (const id of ["bsort", "jsort"]) { try { const v = localStorage.getItem(id); if (v) $(id).value = v; } catch (e) {}
  $(id).addEventListener("change", () => { try { localStorage.setItem(id, $(id).value); } catch (e) {} }); }
toggle("f-mail", "mail"); toggle("f-fit", "fit"); toggle("f-skip", "skip");
$("q").oninput = render;
$("reload").onclick = () => (archive = null, load()).catch(e => $("updated").textContent = "Couldn't load: " + e.message);

setTrack(TRACK);
function show() {
  $("connect").hidden = !!token; $("app").hidden = !token; $("view-insights").hidden = true; $("view-jobs").hidden = true;
  if (token) setView();
  if (token) load().catch(e => { $("updated").textContent = "Couldn't load: " + e.message;
    if (/^401/.test(e.message)) { try { localStorage.removeItem("dash_key"); } catch (x) {} token = null; show(); $("err").textContent = "That key didn't work."; } });
}
$("save").onclick = () => { token = $("token").value.trim().replace(/^.*#key=/, ""); try { localStorage.setItem("dash_key", token); } catch (e) {} show(); };
window.addEventListener("hashchange", () => takeLinkKey() && show());
show();
</script>
</body>
</html>
