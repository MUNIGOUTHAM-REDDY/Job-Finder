<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Application Tracker</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --ink: #16181d; --muted: #646b78; --line: #e3e6eb; --accent: #1e40af;
  --chip: #eef1f5; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1115; --card: #171a21; --ink: #e8eaee; --muted: #9aa2b1; --line: #262b35; --accent: #8fb0ff;
          --chip: #222733; --good: #4ade80; --warn: #fbbf24; --bad: #f87171; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.stat.on { border-color: var(--accent); }
.stat b { display: block; font-size: 22px; }
.stat span { color: var(--muted); font-size: 12px; }
.bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
input, select, textarea, button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
button { cursor: pointer; }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
#q { flex: 1; min-width: 180px; }
.list { display: grid; gap: 10px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.top { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.title { font-weight: 600; }
.meta { color: var(--muted); font-size: 13px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.chip { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
.chip.good { color: var(--good); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.events { margin: 8px 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
pre { white-space: pre-wrap; background: var(--chip); padding: 10px; border-radius: 8px; font: 13px/1.45 inherit; }
textarea { width: 100%; min-height: 60px; margin-top: 6px; }
.actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.login { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; max-width: 560px; }
.login input { width: 100%; margin: 10px 0; }
.empty { color: var(--muted); padding: 30px 0; text-align: center; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Application Tracker</h1>
  <p class="sub" id="sub">Jobs found, resumes sent and where each application stands.</p>

  <section class="login" id="login" hidden>
    <p><b>Connect your private log.</b> Paste a GitHub fine-grained token with <i>Contents: read and write</i> on
      <code>job-applications</code>. It is kept only in this browser and sent only to GitHub.</p>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <button class="primary" id="save">Connect</button>
    <p class="meta" id="err"></p>
  </section>

  <section id="app" hidden>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input id="q" placeholder="Search company or title">
      <select id="sort"><option value="found">Newest first</option><option value="fit">Best fit first</option></select>
      <button id="reload">Refresh</button>
      <button id="logout">Disconnect</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</main>
<script>
const REPO = { owner: "MUNIGOUTHAM-REDDY", name: "job-applications" };
const STATUSES = ["prepared", "approved", "applied", "interview", "offer", "rejected", "skipped", "error"];
const LABEL = { prepared: "Waiting for you", approved: "Approved", applied: "Applied", interview: "Interview",
                offer: "Offer", rejected: "Rejected", skipped: "Skipped", error: "Error" };
let token = null, apps = [], filter = null;
try { token = localStorage.getItem("gh_token"); } catch (e) {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = s => s ? new Date(s).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "";

async function gh(path, opts = {}) {
  const r = await fetch("https://api.github.com" + path, { ...opts,
    headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opts.headers || {}) } });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 160));
  return r;
}

async function load() {
  $("sub").textContent = "Loading…";
  const q = `query { repository(owner:"${REPO.owner}", name:"${REPO.name}") { object(expression:"HEAD:applications") {
    ... on Tree { entries { name oid object { ... on Blob { text } } } } } } }`;
  const r = await gh("/graphql", { method: "POST", body: JSON.stringify({ query: q }) });
  const j = await r.json();
  if (j.errors) throw new Error(j.errors[0].message);
  const entries = j.data.repository?.object?.entries || [];
  apps = entries.filter(e => e.name.endsWith(".json")).map(e => ({ ...JSON.parse(e.object.text), _sha: e.oid, _file: e.name }));
  $("sub").textContent = `${apps.length} jobs tracked · updated ${new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })}`;
  render();
}

function render() {
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0]));
  apps.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);
  const emailed = apps.filter(a => a.email).length;
  $("stats").innerHTML = [["all", "All jobs", apps.length], ["emailed", "Emailed", emailed],
    ...STATUSES.filter(s => s !== "error" || counts.error).map(s => [s, LABEL[s], counts[s]])]
    .map(([k, l, n]) => `<div class="stat ${filter === k || (!filter && k === "all") ? "on" : ""}" data-k="${k}"><b>${n}</b><span>${l}</span></div>`).join("");
  document.querySelectorAll(".stat").forEach(el => el.onclick = () => { filter = el.dataset.k === "all" ? null : el.dataset.k; render(); });

  const q = $("q").value.toLowerCase();
  let rows = apps.filter(a => (!filter || (filter === "emailed" ? a.email : a.status === filter))
    && (!q || (a.company + " " + a.title).toLowerCase().includes(q)));
  rows.sort($("sort").value === "fit" ? (a, b) => (b.fit?.score || 0) - (a.fit?.score || 0)
                                      : (a, b) => (b.found_at || "").localeCompare(a.found_at || ""));
  $("list").innerHTML = rows.length ? rows.map(a => {
    const fit = a.fit?.score;
    const fitClass = fit >= 75 ? "good" : fit >= 50 ? "warn" : "bad";
    return `<article class="row" data-key="${a.key}">
      <div class="top">
        <div>
          <div class="title">${esc(a.title)}</div>
          <div class="meta">${esc(a.company)} · ${esc(a.location || "")} · ${esc(a.source)} · found ${when(a.found_at)}</div>
          <div class="chips">
            ${fit != null ? `<span class="chip ${fitClass}">Fit ${fit}</span>` : ""}
            <span class="chip">${a.email ? "✉️ Emailed " + esc(a.email.to) : "✉️ " + esc(a.email_skipped || "Not emailed")}</span>
            ${a.salary_text ? `<span class="chip">${esc(a.salary_text)}</span>` : ""}
          </div>
        </div>
        <div class="actions">
          <select data-act="status">${STATUSES.map(s => `<option value="${s}" ${s === a.status ? "selected" : ""}>${LABEL[s]}</option>`).join("")}</select>
          <a href="${esc(a.url)}" target="_blank" rel="noopener">Job</a>
          ${a.resume ? `<button data-act="pdf">Resume</button>` : ""}
        </div>
      </div>
      <details>
        <summary>History, email and notes</summary>
        <ul class="events">${(a.events || []).map(e => `<li>${when(e.at)}: ${esc(e.text)}</li>`).join("")}</ul>
        ${a.fit ? `<p class="meta">${esc(a.fit.reason)}${a.fit.gaps?.length ? "<br>Gaps: " + esc(a.fit.gaps.join("; ")) : ""}</p>` : ""}
        ${a.email ? `<p class="meta"><b>${esc(a.email.subject)}</b></p><pre>${esc(a.email.body)}</pre>` : ""}
        <textarea data-act="notes" placeholder="Notes: who you spoke to, interview dates…">${esc(a.notes || "")}</textarea>
        <button data-act="save-notes">Save notes</button>
      </details>
    </article>`;
  }).join("") : `<div class="empty">Nothing here yet.</div>`;

  document.querySelectorAll(".row").forEach(row => {
    const a = apps.find(x => x.key === row.dataset.key);
    row.querySelector('[data-act="status"]').onchange = e => update(a, { status: e.target.value }, `Marked ${LABEL[e.target.value]} on the dashboard`);
    row.querySelector('[data-act="save-notes"]').onclick = () => update(a, { notes: row.querySelector('[data-act="notes"]').value }, null);
    const pdf = row.querySelector('[data-act="pdf"]');
    if (pdf) pdf.onclick = () => openPdf(a);
  });
}

async function update(a, changes, eventText) {
  const rec = { ...a }; delete rec._sha; delete rec._file;
  Object.assign(rec, changes);
  if (eventText) rec.events = [...(rec.events || []), { at: new Date().toISOString().slice(0, 19) + "+00:00", text: eventText }];
  const bytes = new TextEncoder().encode(JSON.stringify(rec, null, 2) + "\n");
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  try {
    const r = await gh(`/repos/${REPO.owner}/${REPO.name}/contents/applications/${a._file}`, { method: "PUT",
      body: JSON.stringify({ message: `Dashboard: ${a.company} ${Object.keys(changes).join(", ")}`, content: btoa(bin), sha: a._sha }) });
    const j = await r.json();
    Object.assign(a, rec, { _sha: j.content.sha });
    render();
  } catch (e) {
    alert("Couldn't save (" + e.message + "). Refresh and try again.");
  }
}

async function openPdf(a) {
  const w = window.open("", "_blank");
  const r = await gh(`/repos/${REPO.owner}/${REPO.name}/contents/${a.resume}`, { headers: { Accept: "application/vnd.github.raw" } });
  const url = URL.createObjectURL(new Blob([await r.arrayBuffer()], { type: "application/pdf" }));
  if (w) w.location = url; else location.href = url;
}

function show() {
  $("login").hidden = !!token; $("app").hidden = !token;
  if (token) load().catch(e => { $("sub").textContent = "Couldn't load: " + e.message; });
}
$("save").onclick = () => { token = $("token").value.trim(); try { localStorage.setItem("gh_token", token); } catch (e) {} show(); };
$("logout").onclick = () => { token = null; try { localStorage.removeItem("gh_token"); } catch (e) {} show(); };
$("reload").onclick = () => load().catch(e => $("sub").textContent = "Couldn't load: " + e.message);
$("q").oninput = render; $("sort").onchange = render;
show();
</script>
</body>
</html>
